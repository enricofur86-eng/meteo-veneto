name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compila
        run: gradle assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeteoVeneto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeteoVeneto-apk
          path: MeteoVeneto.apk

      - name: Pubblica la Release con l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MeteoVeneto.apk \
            --title "Meteo Veneto (build ${{ github.run_number }})" \
            --notes "APK di prova (firma di sviluppo). Scarica MeteoVeneto.apk e installalo." \
            --latest
